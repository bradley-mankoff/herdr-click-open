# Ctrl-click a link in any pane to open it beside the conversation. A Bead link on the
# beads-ui board opens that Bead in the nearest board tab, with the board switched to the
# link's project first (board.sh); a web link opens in terminal-browser, and a file:// link
# opens in micro (open.sh). herdr passes only Ctrl-clicks to plugins, because the mouse
# reports it gets from the terminal carry no Command key. A Bead id in a Project Manager's
# reply becomes a board link through the bead-links extension (fac-qpv.7.1).
#
# The board handler comes first: herdr checks the handlers in this order, and a board link
# is a web link as well.
id = "click-open"
name = "Click Open"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "Ctrl-click a board link, web link or file link to show the Bead, the page or the file beside the conversation."
platforms = ["macos"]

[[actions]]
id = "open"
title = "Open the clicked link in a split"
command = ["bash", "open.sh"]

[[actions]]
id = "board"
title = "Show the clicked Bead on the board"
command = ["bash", "board.sh"]

[[link_handlers]]
id = "board"
title = "Show the Bead on the board"
pattern = "^https?://[^/]+/#/board\\?"
action = "board"

[[link_handlers]]
id = "web"
title = "Open in terminal-browser"
pattern = "^https?://"
action = "open"

[[link_handlers]]
id = "file"
title = "Open in micro"
pattern = "^file://"
action = "open"
